<!-- ================= LOGIN ================= -->
<div class="auth-wrap" id="authView" hidden>
  <div class="auth-blob b1"></div>
  <div class="auth-blob b2"></div>
  <div class="auth-blob b3"></div>
  <form class="auth-card" id="loginForm" autocomplete="off" novalidate>
    <div class="auth-logo">
      <svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="lgm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D62828"/><stop offset=".6" stop-color="#F77F00"/><stop offset="1" stop-color="#FCBF49"/></linearGradient></defs><rect width="48" height="48" rx="14" fill="url(#lgm)"/><circle cx="17" cy="31" r="7.5" fill="none" stroke="#fff" stroke-width="3.5"/><circle cx="34" cy="31" r="7.5" fill="none" stroke="#fff" stroke-width="3.5"/><path d="M8 18h14l4-5h8" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="34" cy="31" r="2.4" fill="#fff"/></svg>
    </div>
    <h1 class="auth-title">Nu<em>Motor</em>indo <span>Finance</span></h1>
    <p class="auth-sub">Dashboard laba rugi showroom motor bekas</p>
    <label>Username
      <input id="liUser" placeholder="mis. admin" required>
    </label>
    <label>Password
      <input id="liPass" type="password" placeholder="••••••••" required>
    </label>
    <button class="btn primary lg block" type="submit">Masuk &nbsp;→</button>
    <p class="auth-error" id="liErr" hidden></p>
    <p class="auth-hint" id="authHint" hidden>Demo login — <b>admin / admin123</b> · <b>kasir / kasir123</b></p>
  </form>
</div>

<!-- ================= APP SHELL ================= -->
<div class="shell" id="appShell" hidden>
  <aside class="sidebar" id="sidebar">
    <a class="side-brand" href="#/dashboard">
      <svg viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="14" fill="url(#lgm2)"/><defs><linearGradient id="lgm2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D62828"/><stop offset=".6" stop-color="#F77F00"/><stop offset="1" stop-color="#FCBF49"/></linearGradient></defs><circle cx="17" cy="31" r="7.5" fill="none" stroke="#fff" stroke-width="3.5"/><circle cx="34" cy="31" r="7.5" fill="none" stroke="#fff" stroke-width="3.5"/><path d="M8 18h14l4-5h8" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="34" cy="31" r="2.4" fill="#fff"/></svg>
      <span>Nu<em>Motor</em>indo<b>Finance</b></span>
    </a>
    <nav class="side-nav" id="sideNav">
      <a href="#/dashboard" data-route="#/dashboard"><i>📊</i>Dashboard</a>
      <a href="#/stok" data-route="#/stok"><i>🏍️</i>Stok Motor</a>
      <a href="#/opex" data-route="#/opex"><i>💸</i>Biaya Operasional</a>
      <a href="#/laba-rugi" data-route="#/laba-rugi"><i>💰</i>Laba Rugi</a>
      <a href="#/pengguna" data-route="#/pengguna" id="navPengguna" hidden><i>👥</i>Pengguna</a>

      <a href="#/pengaturan" data-route="#/pengaturan"><i>⚙️</i>Pengaturan</a>
    </nav>
    <div class="side-foot">
      <div class="user-chip">
        <span class="avatar" id="uAvatar">?</span>
        <span class="user-meta"><b id="uName">—</b><small id="uRole">—</small></span>
      </div>
      <button class="btn ghost sm block" id="btnLogout">⎋&nbsp; Keluar</button>
    </div>
  </aside>

  <div class="main-wrap">
    <header class="topbar">
      <button class="burger" id="btnBurger" aria-label="Menu">☰</button>
      <h2 id="pageTitle">Dashboard</h2>
      <span class="clock" id="clock"></span>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>

<div id="overlayRoot"></div>
<div id="toastRoot" class="toast-root"></div>

<script src="/js/app.js"></script>
</body>
</html>
